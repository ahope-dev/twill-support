<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | Twill</title><link rel="icon" href="/twill-support/icon.png"><style>body{margin:0;background:#f7f3f5;color:#2c2029;font:17px/1.6 system-ui,sans-serif}main{max-width:420px;margin:0 auto;padding:56px 24px}h1{font-size:30px;margin:0 0 8px}p{color:#6b5a66;margin:0 0 24px}label{display:block;font-size:14px;margin:16px 0 6px}input{box-sizing:border-box;width:100%;height:52px;border:1px solid #dacbd4;border-radius:14px;padding:0 16px;font-size:17px;background:#fff}button{margin-top:24px;width:100%;height:54px;border:0;border-radius:27px;background:#684358;color:#fff;font-size:17px;font-weight:600}button:disabled{opacity:.5}.msg{margin-top:20px;font-size:15px}.err{color:#a3364a}</style></head><body><main>
<h1>Set a new password</h1><p id="lead">Choose a new password for your Twill account. · 트윌 계정의 새 비밀번호를 입력해 주세요.</p>
<form id="f"><label for="p1">New password · 새 비밀번호 (8+)</label><input id="p1" type="password" autocomplete="new-password" minlength="8" required><label for="p2">Confirm · 확인</label><input id="p2" type="password" autocomplete="new-password" minlength="8" required><button id="b" type="submit">Update password · 변경</button></form><div id="m" class="msg"></div>
<script>
const SUPABASE='https://qjcghmtymxguwrvmddos.supabase.co', ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqY2dobXR5bXhndXdydm1kZG9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMDg3NTMsImV4cCI6MjEwNjg4NDc1M30._0zDJAQdMNkmLkFsYkpwC9_4f1l60GoMr8jTB9s83us';
const h=new URLSearchParams(location.hash.slice(1)), q=new URLSearchParams(location.search);
const token=h.get('access_token'), err=h.get('error_description')||q.get('error_description');
const f=document.getElementById('f'), m=document.getElementById('m'), b=document.getElementById('b');
function say(t,bad){m.textContent=t;m.className='msg'+(bad?' err':'')}
if(err||!token){f.style.display='none';say((err?err+' — ':'')+'This link is invalid or has expired. Open Twill and tap Forgot password? again. · 링크가 만료됐습니다. 앱에서 다시 요청해 주세요.',true)}
history.replaceState(null,'',location.pathname);
f.addEventListener('submit',async e=>{e.preventDefault();const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;
if(p1.length<8)return say('Use at least 8 characters. · 8자 이상 입력해 주세요.',true);
if(p1!==p2)return say('Passwords don’t match. · 비밀번호가 서로 다릅니다.',true);
b.disabled=true;say('…');
try{const r=await fetch(SUPABASE+'/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json',apikey:ANON,Authorization:'Bearer '+token},body:JSON.stringify({password:p1})});
const j=await r.json().catch(()=>({}));
if(!r.ok){b.disabled=false;return say(j.msg||j.error_description||j.message||'Couldn’t update the password. Please try again.',true)}
f.style.display='none';document.getElementById('lead').style.display='none';say('Password updated. Go back to Twill and sign in with your new password. · 비밀번호가 변경됐습니다. 트윌 앱에서 새 비밀번호로 로그인해 주세요.')}
catch(_){b.disabled=false;say('Please check your connection and try again. · 연결을 확인해 주세요.',true)}});
</script></main></body></html>
